<canvas id="c"></canvas>
<script>
(()=>{
'use strict';

/* ================= الإعدادات ================= */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let cw=800,ch=400,dpr=1,scale=1;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  cw=window.innerWidth;ch=window.innerHeight;
  cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);
  scale=Math.min(cw/860,ch/500);
}
window.addEventListener('resize',resize);resize();

const STEP=16,G=900,R=24,I_IN=2800,PX_M=25,START_X=300,BASE_Y=900;
const K_SUS=95,C_SUS=10,TRAVEL=16,K_BUMP=900,MU=1.5;
const ENGINE=400,VMAX=680,BRAKE=620,VREV=260,AIR_T=7;
const K_BODY=700,C_BODY=30;
const CARS=[{n:'الجيب',c:['#ff6a57','#e02e2d','#a5161b','#5e0b10'],p:1,f:1,g:1,$:0},{n:'الرياضية',c:['#ffd24a','#f29a1b','#b5600c','#5e3004'],p:1.25,f:0.9,g:1.1,$:900},{n:'وحش الجبال',c:['#6fb3ff','#2f6fd6','#1a3f8c','#0c1f4a'],p:1.5,f:1.25,g:1.25,$:2500},{n:'الشاحنة',c:['#8fd16b','#3f9e34','#256b1e','#0f3a0c'],p:1.1,f:1.5,g:1.35,$:1500},{n:'الفورمولا',c:['#ff7aa8','#e0245e','#9a0f3b','#4d0620'],p:1.8,f:0.85,g:1.15,$:4000},{n:'الدبابة',c:['#b6bfa0','#7d8a5c','#4d5937','#262d1a'],p:2,f:1.6,g:1.5,$:8000},{n:'التوكتوك',k:'tuk',c:['#ffe066','#f5c518','#b8860b','#5c4305'],p:0.9,f:0.9,g:1,$:500},{n:'الموتوسيكل',k:'bike',c:['#ff6a57','#e02e2d','#a5161b','#5e0b10'],p:1.4,f:0.7,g:0.9,$:700},{n:'الجرار',k:'tractor',c:['#5fd35f','#2e9e3d','#1d6b27','#0d3b13'],p:1.15,f:1.3,g:1.6,$:1200}];
const WR={tuk:[20,20],bike:[22,22],tractor:[34,18]};
const SKY=[['#6fb6ff','#cfe9ff'],['#f3a45c','#ffe2a8'],['#9fc2e6','#eef5fb'],['#000008','#0b0b22']];
const MAPS=[{n:'الجبال الخضراء',gr:['#2f7d2c','#62b845'],so:['#86623f','#5a3f27','#2c1f14'],tr:1,mu:1,rc:[[[143,166,201],[22,28,60]],[[103,138,150],[18,30,50]],[[78,128,86],[14,32,34]]]},{n:'الصحراء',gr:['#c4973f','#e8c46f'],so:['#c9955c','#92603a','#4a2f1b'],tr:0,mu:1,rc:[[[214,170,130],[50,30,40]],[[196,140,95],[44,26,30]],[[180,120,70],[36,22,22]]]},{n:'الثلج',gr:['#b9c9d8','#ffffff'],so:['#8e96a3','#5b6370','#2a2f39'],tr:1,mu:0.72,rc:[[[190,205,225],[30,36,66]],[[160,180,205],[24,32,56]],[[225,235,245],[40,50,70]]]},{n:'سطح القمر',gr:['#8d8d94','#c9c9d1'],so:['#7a7a82','#55555d','#2a2a30'],tr:0,mu:0.9,gv:0.4,nt:1,rc:[[[70,70,85],[70,70,85]],[[95,95,108],[95,95,108]],[[120,120,134],[120,120,134]]]}];
const DIFFS=[{n:'سهل',a:0.85,f:0.75,c:0.7},{n:'عادي',a:1.2,f:0.95,c:0.9},{n:'صعب',a:1.55,f:1.15,c:1.1},{n:'جحيم',a:1.95,f:1.4,c:1.35}];
let sv={coins:0,car:0,own:[1,0,0],up:[0,0,0],turbo:1,map:0,diff:1,music:1,sfx:1};
try{Object.assign(sv,JSON.parse(localStorage.getItem('hillrace_save')||'{}'));}catch(e){}
while(sv.own.length<CARS.length)sv.own.push(0);
function save(){try{localStorage.setItem('hillrace_save',JSON.stringify(sv));}catch(e){}}
let DF=DIFFS[sv.diff],MP=MAPS[sv.map],tb=0,runCoins=0,coinsA=[],nextCoinX=0;
const DAY_LEN=900;               // طول دورة النهار والليل بالمتر
const BODY=[[102,13,0],[-96,13,0],[88,-17,0],[-90,-17,0],[50,-24,0],[-50,-49,1],[0,-49,1],[18,-49,1]]; // 1 = السقف

function rnd(i){const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s);}
function lerp(a,b,t){return a+(b-a)*t;}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}

/* ================= التضاريس: مرتفعات وجسور ================= */
let ground,col,seg,bridges,cans,yOff,nextBridgeX,nextCanX;
function hill(x){
  const A=(12+Math.min(100,Math.max(0,x-700)*0.011))*DF.a;
  return A*(Math.sin(x*0.0031)+0.5*Math.sin(x*0.0073+1.3)+0.12*Math.sin(x*0.021+0.5));
}
function initTerrain(){
  ground=[BASE_Y];col=[BASE_Y];seg=[false];bridges=[];cans=[];coinsA=[];nextCoinX=900;
  yOff=BASE_Y-hill(0);
  nextBridgeX=2800+Math.random()*800;
  nextCanX=1500;
}
function pushPt(g,c){ground.push(g);col.push(c);seg.push(false);}
function ensureTerrain(tx){
  while((ground.length-1)*STEP<tx){
    const i=ground.length,x=i*STEP;
    const sl=i>1?(ground[i-1]-ground[i-2])/STEP:0;
    if(x>=nextBridgeX&&Math.abs(sl)<0.2){
      const s=i-1,y0=ground[s];
      const n=34+Math.floor(Math.random()*22),depth=240+Math.random()*120;
      col[s]=y0;
      for(let k=1;k<=n;k++){
        seg[s+k-1]=true;
        pushPt(y0+depth*Math.pow(Math.max(0,Math.sin(Math.PI*k/n)),0.35),y0);
      }
      bridges.push({s:s,e:s+n,y:y0,r:Math.random()<0.55?1:0,sag:30,amp:8});
      const xe=(s+n)*STEP;
      yOff=y0-hill(xe);
      nextBridgeX=xe+2600+Math.random()*2400;
      continue;
    }
    const h=yOff+hill(x);
    pushPt(h,h);
  }
  while(nextCanX<tx-300){cans.push({x:nextCanX,t:false});nextCanX+=(2300+Math.random()*1500)*DF.c*(1+Math.min(0.5,nextCanX/60000));}
  while(nextCoinX<tx-300){const n=4+Math.floor(Math.random()*4);for(let k=0;k<n;k++)coinsA.push({x:nextCoinX+k*55,t:false});nextCoinX+=800+Math.random()*900;}
}
function surf(x){
  const f=x/STEP,i=Math.floor(f);
  if(i<0)return col[0];
  if(i>=col.length-1)return col[col.length-1];
  const t=f-i;return col[i]*(1-t)+col[i+1]*t;
}
function slopeAt(x){
  let i=Math.floor(x/STEP);
  if(i<0)i=0;if(i>col.length-2)i=col.length-2;
  return (col[i+1]-col[i])/STEP;
}

/* ================= الحالة ================= */
const st={mode:'menu',t:0,reason:'',stall:0,from:'menu',msg:'',tab:0};
const input={gas:false,brake:false,pg:false,pb:false};
const kb={gas:false,brake:false};
const car={x:0,y:0,a:0,vx:0,vy:0,w:0,fuel:100,gr:0,wh:[]};
let camX=0,camY=0,night=0,best=0,muted=false,parts=[],time=0;
try{best=parseFloat(localStorage.getItem('hillrace_best'))||0;}catch(e){}
muted=!sv.sfx;

function resetCar(){
  car.x=START_X;car.y=surf(START_X)-42;car.a=0;car.vx=0;car.vy=0;car.w=0;car.fuel=100;car.gr=0;
  car.wh=[-55,55].map(lx=>({lx:lx,ly:22,sp:0,rot:0,hx:0,hy:0,cx:0,cy:0,dy:0,on:false,vt:0}));
  for(const w of car.wh){w.hx=car.x+w.lx;w.hy=car.y+w.ly;w.cx=w.hx;w.cy=w.hy;}
  st.stall=0;
}
function startGame(){
  DF=DIFFS[sv.diff];MP=MAPS[sv.map];runCoins=0;tb=0;st.msg='';st.lw=0;
  initTerrain();ensureTerrain(START_X+2800);resetCar();
  parts=[];st.mode='play';st.t=0;
  camX=car.x-(cw/scale)*0.33;camY=car.y-(ch/scale)*0.52;
}
function say(t){if(muted)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ar-EG';speechSynthesis.speak(u);}catch(e){}}
function crash(reason){
  if(st.mode!=='play')return;
  st.mode='crash';st.reason=reason;st.t=0;
  sndCrash();say(reason==='fuel'?'معدش ولا نقطة':'خربت العربية');
  for(let i=0;i<26;i++)addP(car.x,car.y-10,(Math.random()-0.5)*420,-Math.random()*320,0.7+Math.random()*0.5,3,'255,190,60',-2);
}
function distM(){return Math.max(0,(car.x-START_X)/PX_M);}
function go(m){st.from=st.mode;st.mode=m;st.msg='';ptr.clear();updInput();}
function toMenu(){save();initTerrain();ensureTerrain(START_X+2800);resetCar();st.mode='menu';st.msg='';}

/* ================= الفيزياء ================= */
function physics(dt){
  const c=car,cs=Math.cos(c.a),sn=Math.sin(c.a);
  const playing=st.mode==='play';
  const gas=playing&&(input.gas||tb>0)&&c.fuel>0;
  const brake=playing&&input.brake;
  let ax=0,ay=G*(MP.gv||1),aw=0,on=0;const PW=CARS[sv.car].p*(1+0.12*sv.up[0]);

  for(const wh of c.wh){
    const hx=c.x+wh.lx*cs-wh.ly*sn,hy=c.y+wh.lx*sn+wh.ly*cs;
    const gy=surf(hx),pen=hy+R-gy;
    wh.hx=hx;wh.hy=hy;wh.on=false;
    let tgt=6;
    if(pen>0){
      const m=slopeAt(hx),len=Math.sqrt(1+m*m);
      const nx=m/len,ny=-1/len,tx=1/len,ty=m/len;
      const penN=pen/len;
      const rx=hx-c.x,ry=gy-c.y;
      const vpx=c.vx-c.w*ry,vpy=c.vy+c.w*rx;
      const vn=vpx*nx+vpy*ny,vt=vpx*tx+vpy*ty;
      let Fn=K_SUS*penN-C_SUS*vn;
      if(penN>TRAVEL)Fn+=K_BUMP*(penN-TRAVEL);
      if(Fn<0)Fn=0;
      let Ft;
      if(brake){
        if(vt>25)Ft=-Math.min(BRAKE,vt*10);
        else if(c.fuel>0)Ft=-ENGINE*0.7*Math.max(0,1+vt/VREV);
        else Ft=-vt*3;
      }else if(gas){
        Ft=ENGINE*PW*(tb>0?1.8:1)*clamp(1-vt/(VMAX*(tb>0?1.35:1)),0,1.6);
      }else{
        Ft=-vt*0.25;
      }
      const maxF=MU*MP.mu*(0.9+0.1*CARS[sv.car].g)*(1+0.08*sv.up[2])*Fn;
      Ft=clamp(Ft,-maxF,maxF);
      const Fx=Fn*nx+Ft*tx,Fy=Fn*ny+Ft*ty;
      ax+=Fx;ay+=Fy;
      aw+=(rx*Fn*ny-ry*Fn*nx+rx*Ft*ty-ry*0.35*Ft*tx)/I_IN;
      wh.on=true;wh.vt=vt;on++;
      tgt=-pen;
    }
    wh.dy+=(tgt-wh.dy)*Math.min(1,dt*22);
    wh.cx=hx;wh.cy=hy+wh.dy;
    if(wh.on)wh.sp=wh.vt/R;
    else wh.sp=(wh.sp+(gas?500*dt:0))*(1-(brake?4:0.3)*dt);
    wh.rot+=wh.sp*dt;
  }
  c.gr=on;

  for(const b of BODY){
    const lx=b[0],ly=b[1];
    const px=c.x+lx*cs-ly*sn,py=c.y+lx*sn+ly*cs;
    const gy=surf(px),pen=py-gy;
    if(pen>0){
      if(b[2]===1&&pen>2)crash('flip');
      const m=slopeAt(px),len=Math.sqrt(1+m*m);
      const nx=m/len,ny=-1/len,tx=1/len,ty=m/len;
      const rx=px-c.x,ry=gy-c.y;
      const vpx=c.vx-c.w*ry,vpy=c.vy+c.w*rx;
      const vn=vpx*nx+vpy*ny,vt=vpx*tx+vpy*ty;
      let Fn=K_BODY*pen/len-C_BODY*vn;if(Fn<0)Fn=0;
      const Ft=clamp(-vt*6,-MU*Fn,MU*Fn);
      const Fx=Fn*nx+Ft*tx,Fy=Fn*ny+Ft*ty;
      ax+=Fx;ay+=Fy;
      aw+=(rx*Fy-ry*Fx)/I_IN;
    }
  }

  if(on===0){
    if(gas)aw-=AIR_T;
    if(brake)aw+=AIR_T;
    aw-=c.w*0.6;
  }else aw-=c.w*0.8;

  c.vx+=ax*dt;c.vy+=ay*dt;c.w=clamp(c.w+aw*dt,-12,12);
  c.x+=c.vx*dt;c.y+=c.vy*dt;c.a+=c.w*dt;
  if(c.x<START_X-200){c.x=START_X-200;if(c.vx<0)c.vx=0;}

  if(playing){
    c.fuel-=(gas?6:0.6)*DF.f*dt/(CARS[sv.car].f*(1+0.2*sv.up[1]));tb=Math.max(0,tb-dt);if(c.fuel<25&&c.fuel>0&&!st.lw){st.lw=1;say('بقيت عالحطياتي');}else if(c.fuel>=25)st.lw=0;
    for(const k of coinsA){if(k.t||Math.abs(k.x-c.x)>70)continue;if(Math.hypot(k.x-c.x,surf(k.x)-48-c.y)<62){k.t=true;sv.coins+=5;runCoins+=5;sndCoin();}}
    if(c.fuel<=0){
      c.fuel=0;
      if(Math.abs(c.vx)<15&&on>0)st.stall+=dt;else st.stall=0;
      if(st.stall>1.5)crash('fuel');
    }
    for(const k of cans){
      if(k.t||Math.abs(k.x-c.x)>90)continue;
      const ky=surf(k.x)-40;
      if(Math.hypot(k.x-c.x,ky-c.y)<75){
        k.t=true;c.fuel=Math.min(100,c.fuel+50);sndPickup();
        for(let i=0;i<14;i++)addP(k.x,ky,(Math.random()-0.5)*260,-Math.random()*260,0.6,3,'255,230,90',-3);
      }
    }
  }
}
function step(dt){
  if(st.mode==='pause')return;
  ensureTerrain(car.x+2800);
  physics(dt);
  for(const b of bridges)if(b.r&&b.e*STEP>car.x-700&&b.s*STEP<car.x+700){const am=b.amp+Math.min(8,Math.abs(car.vx)*0.012);for(let i=b.s+1;i<b.e;i++){const t=(i-b.s)/(b.e-b.s);col[i]=b.y+4*t*(1-t)*(b.sag+Math.sin(i*0.55-time*5)*am);}}
  if(st.mode==='crash'||st.mode==='over'){
    st.t+=dt;
    if(st.mode==='crash'&&st.t>1.1){
      st.mode='over';st.t=0;
      const d=distM();
      if(d>best){best=d;try{localStorage.setItem('hillrace_best',String(best));}catch(e){}}save();
    }
  }
}

/* ================= الجسيمات ================= */
function addP(x,y,vx,vy,life,size,color,grow){parts.push({x:x,y:y,vx:vx,vy:vy,l:life,m:life,s:size,c:color,g:grow});if(parts.length>260)parts.shift();}
function updateFx(dt){
  const gas=st.mode==='play'&&input.gas&&car.fuel>0;
  for(const w of car.wh){
    if(w.on&&Math.abs(w.vt)>140&&Math.random()<dt*35)
      addP(w.hx,surf(w.hx)-2,-w.vt*0.08+(Math.random()-0.5)*40,-Math.random()*70,0.6,4,'165,135,100',10);
  }
  if(st.mode==='play'&&Math.random()<dt*(gas?60:16)){
    const cs=Math.cos(car.a),sn=Math.sin(car.a);
    addP(car.x-106*cs-9*sn,car.y-106*sn+9*cs,-60-Math.random()*50,-10-Math.random()*20,0.8,5,'150,150,150',14);
  }
  if(tb>0&&Math.random()<dt*140){const cs=Math.cos(car.a),sn=Math.sin(car.a);addP(car.x-110*cs-9*sn,car.y-110*sn+9*cs,-220-Math.random()*120,(Math.random()-0.5)*40,0.25,5,Math.random()<0.5?'255,140,40':'120,190,255',-6);}
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.l-=dt;
    if(p.l<=0){parts.splice(i,1);continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.s=Math.max(0.5,p.s+p.g*dt);
    if(p.g>0)p.vy-=25*dt;else p.vy+=500*dt;
  }
}

/* ================= الصوت ================= */
let AC=null,eo=[],ef,eg,ng,nf,mg,tg,mtime=0,mstep=0,rpm=900,gear=0;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    ef=AC.createBiquadFilter();ef.type='lowpass';ef.frequency.value=600;
    eg=AC.createGain();eg.gain.value=0;
    ['sawtooth','square','triangle'].forEach(t=>{const o=AC.createOscillator();o.type=t;o.connect(ef);o.start();eo.push(o);});
    ef.connect(eg);eg.connect(AC.destination);
    const lf=AC.createOscillator(),lg=AC.createGain();lf.frequency.value=11;lg.gain.value=22;lf.connect(lg);lg.connect(eo[0].detune);lg.connect(eo[1].detune);lf.start();
    const n=AC.sampleRate,b=AC.createBuffer(1,n,n),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    const ns=AC.createBufferSource();ns.buffer=b;ns.loop=true;nf=AC.createBiquadFilter();nf.type='bandpass';nf.frequency.value=300;nf.Q.value=0.8;
    ng=AC.createGain();ng.gain.value=0;ns.connect(nf);nf.connect(ng);ng.connect(AC.destination);ns.start();
    tg=AC.createGain();tg.gain.value=0;const to=AC.createOscillator();to.type='sine';to.connect(tg);tg.connect(AC.destination);to.start();eo.push(to);
    mg=AC.createGain();mg.gain.value=0.5;mg.connect(AC.destination);
    setInterval(music,100);
  }catch(e){AC=null;}
}
function updSound(dt){
  if(!AC)return;
  try{
    const on=!muted&&(st.mode==='play'||(st.mode==='crash'&&st.t<0.3)),gas=st.mode==='play'&&(input.gas||tb>0)&&car.fuel>0,v=Math.abs(car.vx),t=AC.currentTime;
    const g=Math.min(5,Math.floor(v/130)),r=(v-g*130)/130;
    const tgt=900+(gas?900:0)+Math.min(1,r)*(gas?4200:3000)*(0.5+g*0.1);
    if(g!==gear){if(g>gear)rpm*=0.62;gear=g;}
    rpm+=(tgt-rpm)*Math.min(1,dt*(gas?4:2.5));
    if(rpm>6000)rpm=5600+Math.random()*300;
    const f=rpm/30;
    eo[0].frequency.setTargetAtTime(f,t,0.03);eo[1].frequency.setTargetAtTime(f*0.5,t,0.03);eo[2].frequency.setTargetAtTime(f*2,t,0.03);
    ef.frequency.setTargetAtTime(300+rpm*0.35+(gas?700:0),t,0.05);
    eg.gain.setTargetAtTime(on?(gas?0.11:0.06)+rpm/90000:0,t,0.06);
    nf.frequency.setTargetAtTime(150+rpm*0.12,t,0.05);ng.gain.setTargetAtTime(on?(gas?0.07:0.025)+v/40000:0,t,0.08);
    eo[3].frequency.setTargetAtTime(1500+rpm*0.4,t,0.1);tg.gain.setTargetAtTime(on&&tb>0?0.035:0,t,0.1);
    mg.gain.setTargetAtTime(sv.music?(st.mode==='play'?0.35:0.55):0,t,0.2);
  }catch(e){}
}
const SCL=[[0,3,5,7,10,12],[0,2,3,7,8,12],[0,2,4,7,9,12]];
function mn(f,t,d,ty,v){const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+0.05);}
function music(){
  if(!AC||!sv.music||st.mode==='pause')return;
  const sl=60/(104+sv.map*10)/2;
  if(mtime<AC.currentTime)mtime=AC.currentTime+0.05;
  while(mtime<AC.currentTime+0.35){
    const sc=SCL[sv.map],i=mstep%32,bar=Math.floor(i/8),root=[0,-4,-2,-5][bar]+sv.map*2,hz=n=>110*Math.pow(2,(n+root)/12);
    if(i%2===0)mn(hz(0),mtime,sl*1.8,'triangle',0.2);
    if(i%8===0){mn(hz(12),mtime,sl*7,'sine',0.07);mn(hz(15+sv.map%2),mtime,sl*7,'sine',0.05);mn(hz(19),mtime,sl*7,'sine',0.05);}
    if(i%4===2||i*7%5===0)mn(hz(12+sc[(i*3+bar)%6]),mtime,sl*1.5,'square',0.045);
    mtime+=sl;mstep++;
  }
}
function sndCoin(){if(!AC||muted)return;try{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.setValueAtTime(1175,t);o.frequency.setValueAtTime(1568,t+0.06);g.gain.setValueAtTime(0.06,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.2);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.22);}catch(e){}}
function sndPickup(){
  if(!AC||muted)return;
  try{
    const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type='triangle';o.frequency.setValueAtTime(660,t);o.frequency.setValueAtTime(990,t+0.09);
    g.gain.setValueAtTime(0.14,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.3);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.32);
  }catch(e){}
}
function sndCrash(){
  if(!AC||muted)return;
  try{
    const n=Math.floor(AC.sampleRate*0.5),buf=AC.createBuffer(1,n,AC.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.2);
    const s=AC.createBufferSource(),g=AC.createGain(),fl=AC.createBiquadFilter();
    fl.type='lowpass';fl.frequency.value=900;g.gain.value=0.5;
    s.buffer=buf;s.connect(fl);fl.connect(g);g.connect(AC.destination);s.start();
  }catch(e){}
}

const KEYS=[[0,[58,141,224],[191,227,255],0],[0.36,[58,141,224],[191,227,255],0],[0.5,[84,64,150],[255,150,90],0.3],[0.62,[8,10,32],[27,36,80],1],[0.85,[8,10,32],[27,36,80],1],[0.94,[96,104,168],[255,176,124],0.35],[1,[58,141,224],[191,227,255],0]];
function mix3(a,b,u){return[lerp(a[0],b[0],u),lerp(a[1],b[1],u),lerp(a[2],b[2],u)];}
function rgb(c,a){return 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+(a==null?1:a)+')';}
function palette(t){
  for(let i=0;i<KEYS.length-1;i++){
    const a=KEYS[i],b=KEYS[i+1];
    if(t>=a[0]&&t<=b[0]){const u=(t-a[0])/(b[0]-a[0]);return{top:mix3(a[1],b[1],u),bot:mix3(a[2],b[2],u),night:lerp(a[3],b[3],u)};}
  }
  return{top:KEYS[0][1],bot:KEYS[0][2],night:0};
}
const stars=[];for(let i=0;i<70;i++)stars.push({x:rnd(i+1),y:rnd(i+99),r:1+rnd(i+7)*1.6,a:0.4+rnd(i+55)*0.6});

function setScreen(){ctx.setTransform(dpr,0,0,dpr,0,0);}
function setWorld(){const S=dpr*scale;ctx.setTransform(S,0,0,S,-camX*S,-camY*S);}

function ridge(par,off,amp,f1,f2,ph,cDay,cNight){
  const yb=ch*0.5+(BASE_Y-camY-ch/scale*0.5)*scale*par-off*scale;
  ctx.fillStyle=rgb(mix3(cDay,cNight,night));
  ctx.beginPath();ctx.moveTo(0,ch);
  for(let sx=0;sx<=cw+16;sx+=16){
    const wx=sx/scale+camX*par;
    const h=Math.sin(wx*f1+ph)+0.55*Math.sin(wx*f2+ph*2)+0.2*Math.sin(wx*f2*3.1);
    ctx.lineTo(sx,yb-(h+1.6)*amp*scale);
  }
  ctx.lineTo(cw+16,ch);ctx.closePath();ctx.fill();
}
function drawSky(pal){
  setScreen();
  let g=ctx.createLinearGradient(0,0,0,ch*0.9);
  g.addColorStop(0,rgb(pal.top));g.addColorStop(1,rgb(pal.bot));
  ctx.fillStyle=g;ctx.fillRect(0,0,cw,ch);
  if(night>0.05){
    ctx.fillStyle='#fff';
    for(const s of stars){ctx.globalAlpha=night*s.a;ctx.fillRect(s.x*cw,s.y*ch*0.6,s.r,s.r);}
    ctx.globalAlpha=1;
  }
  if(night<0.85){
    const a=1-night*1.2,sx=cw*0.78,sy=ch*(0.16+night*0.12);

    g.addColorStop(0,'rgba(255,245,200,'+0.9*a+')');g.addColorStop(1,'rgba(255,220,120,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(sx,sy,90,0,7);ctx.fill();
    ctx.fillStyle='rgba(255,252,230,'+a+')';ctx.beginPath();ctx.arc(sx,sy,20,0,7);ctx.fill();
  }
  if(MP.nt){const ex=cw*0.72,ey=ch*0.2;let g=ctx.createRadialGradient(ex-6,ey-6,2,ex,ey,26);g.addColorStop(0,'#8fd0ff');g.addColorStop(1,'#1f4fa8');ctx.fillStyle=g;ctx.beginPath();ctx.arc(ex,ey,26,0,7);ctx.fill();ctx.fillStyle='rgba(80,180,90,0.8)';ctx.beginPath();ctx.ellipse(ex-6,ey+2,9,6,0.5,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(ex+9,ey-8,6,4,0,0,7);ctx.fill();}
  if(night>0.3&&!MP.nt){
    const mx=cw*0.22,my=ch*0.17,a=Math.min(1,(night-0.3)*1.6);
    g=ctx.createRadialGradient(mx,my,6,mx,my,60);
    g.addColorStop(0,'rgba(220,230,255,'+0.35*a+')');g.addColorStop(1,'rgba(220,230,255,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(mx,my,60,0,7);ctx.fill();
    ctx.fillStyle='rgba(244,241,222,'+a+')';ctx.beginPath();ctx.arc(mx,my,17,0,7);ctx.fill();
    ctx.fillStyle='rgba(200,198,180,'+0.5*a+')';
    ctx.beginPath();ctx.arc(mx-5,my-3,4,0,7);ctx.fill();ctx.beginPath();ctx.arc(mx+5,my+5,3,0,7);ctx.fill();
  }
  const ca=0.85-night*0.7;
  if(ca>0.05){
    ctx.fillStyle='rgba(255,255,255,'+ca+')';
    const span=cw+500;
    for(let k=0;k<7;k++){
      const x=((k*330+k*40-camX*0.08*scale)%span+span)%span-250,y=ch*(0.07+0.05*(k%4)),s=(1+0.35*(k%3))*scale*1.4;
      ctx.beginPath();
      ctx.ellipse(x,y,40*s,14*s,0,0,7);ctx.ellipse(x+30*s,y-8*s,30*s,16*s,0,0,7);
      ctx.ellipse(x-30*s,y-4*s,28*s,12*s,0,0,7);ctx.ellipse(x+8*s,y-14*s,24*s,14*s,0,0,7);
      ctx.fill();
    }
  }
  MP.rc.forEach((q,i)=>ridge([0.12,0.28,0.5][i],[170,90,30][i],[60,38,22][i],[0.0016,0.0026,0.004][i],[0.0041,0.0063,0.009][i],[1,2.4,4.1][i],q[0],q[1]));
  
  
}

function drawTree(x,y,h){
  const w=h*0.42;
  ctx.fillStyle='#4a3322';ctx.fillRect(x-h*0.045,y-h*0.2,h*0.09,h*0.22);
  const cols=['#1f5d33','#25703d','#2d8447'];
  for(let k=0;k<3;k++){
    const by=y-h*0.15-k*h*0.24,tw=w*(1-k*0.22),th=h*0.42;
    ctx.fillStyle=cols[k];
    ctx.beginPath();ctx.moveTo(x-tw,by);ctx.lineTo(x,by-th);ctx.lineTo(x+tw,by);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.07)';
    ctx.beginPath();ctx.moveTo(x,by-th);ctx.lineTo(x+tw,by);ctx.lineTo(x+tw*0.2,by);ctx.closePath();ctx.fill();
  }
}
function drawRock(x,y,s){
  let g=ctx.createLinearGradient(x,y-s,x,y);
  g.addColorStop(0,'#9aa0a8');g.addColorStop(1,'#565b63');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.moveTo(x-s*1.1,y+2);ctx.lineTo(x-s*0.7,y-s*0.7);ctx.lineTo(x-s*0.1,y-s);ctx.lineTo(x+s*0.7,y-s*0.6);ctx.lineTo(x+s*1.1,y+2);ctx.closePath();ctx.fill();
}
function drawTerrain(i0,i1,vw,vh){
  const bottom=camY+vh+300;
  // أشجار خلف الأرض
  for(let i=i0;i<=i1;i++){
    if(seg[i]||seg[i-1])continue;
    const r=rnd(i);
    if(MP.tr&&r<0.075)drawTree(i*STEP,ground[i]+5,60+rnd(i+300)*70);
  }
  // التربة
  let g=ctx.createLinearGradient(0,BASE_Y-200,0,BASE_Y+600);
  g.addColorStop(0,MP.so[0]);g.addColorStop(0.5,MP.so[1]);g.addColorStop(1,MP.so[2]);
  ctx.fillStyle=g;
  ctx.beginPath();ctx.moveTo(i0*STEP,ground[i0]);
  for(let i=i0+1;i<=i1;i++)ctx.lineTo(i*STEP,ground[i]);
  ctx.lineTo(i1*STEP,bottom);ctx.lineTo(i0*STEP,bottom);ctx.closePath();ctx.fill();
  // طبقات التربة (خطوط خفيفة)
  ctx.save();ctx.clip();
  ctx.strokeStyle='rgba(0,0,0,0.12)';ctx.lineWidth=2;
  for(let y=BASE_Y-100;y<bottom;y+=46){
    ctx.beginPath();ctx.moveTo(i0*STEP,y);
    for(let x=i0*STEP;x<=i1*STEP;x+=48)ctx.lineTo(x,y+Math.sin(x*0.013+y)*6);
    ctx.stroke();
  }
  ctx.restore();
  // الوادي الصخري تحت الجسور
  for(const b of bridges){
    if(b.e<i0||b.s>i1)continue;
    const a=Math.max(b.s,i0),e=Math.min(b.e,i1);
    g=ctx.createLinearGradient(0,b.y,0,b.y+420);
    g.addColorStop(0,'#8a8f98');g.addColorStop(0.55,'#555a63');g.addColorStop(1,'#25282e');
    ctx.fillStyle=g;
    ctx.beginPath();ctx.moveTo(a*STEP,ground[a]);
    for(let i=a+1;i<=e;i++)ctx.lineTo(i*STEP,ground[i]);
    ctx.lineTo(e*STEP,bottom);ctx.lineTo(a*STEP,bottom);ctx.closePath();ctx.fill();
    ctx.save();ctx.clip();
    ctx.strokeStyle='rgba(0,0,0,0.18)';ctx.lineWidth=2;
    for(let y=b.y+30;y<bottom;y+=26){ctx.beginPath();ctx.moveTo(a*STEP,y);ctx.lineTo(e*STEP,y+(y%3)*2);ctx.stroke();}
    ctx.restore();
  }
  // عشب
  ctx.lineCap='round';ctx.lineJoin='round';
  ctx.strokeStyle=MP.gr[0];ctx.lineWidth=13;
  ctx.beginPath();
  for(let i=i0;i<i1;i++){if(seg[i])continue;ctx.moveTo(i*STEP,ground[i]+1);ctx.lineTo((i+1)*STEP,ground[i+1]+1);}
  ctx.stroke();
  ctx.strokeStyle=MP.gr[1];ctx.lineWidth=6;
  ctx.beginPath();
  for(let i=i0;i<i1;i++){if(seg[i])continue;ctx.moveTo(i*STEP,ground[i]-2);ctx.lineTo((i+1)*STEP,ground[i+1]-2);}
  ctx.stroke();
  // حجارة
  for(let i=i0;i<=i1;i++){
    if(seg[i]||seg[i-1])continue;
    const r=rnd(i+500);
    if(r<0.05)drawRock(i*STEP,ground[i]+2,6+rnd(i+700)*10);
  }
}
function drawRope(b){
  const x0=b.s*STEP,x1=b.e*STEP;ctx.lineCap='round';
  ctx.strokeStyle='#cdb582';ctx.lineWidth=3.5;ctx.beginPath();
  for(let i=b.s;i<=b.e;i++){const y=col[i]-72;if(i===b.s)ctx.moveTo(i*STEP,y);else ctx.lineTo(i*STEP,y);}ctx.stroke();
  ctx.lineWidth=1.8;ctx.beginPath();for(let i=b.s;i<=b.e;i+=2){ctx.moveTo(i*STEP,col[i]);ctx.lineTo(i*STEP,col[i]-72);}ctx.stroke();
  ctx.strokeStyle='#6e4a2a';ctx.lineWidth=10;ctx.beginPath();for(let i=b.s;i<b.e;i++){ctx.moveTo(i*STEP,col[i]+5);ctx.lineTo((i+1)*STEP,col[i+1]+5);}ctx.stroke();
  ctx.strokeStyle='#a97a48';ctx.lineWidth=4;ctx.beginPath();for(let i=b.s;i<b.e;i++){ctx.moveTo(i*STEP,col[i]+2);ctx.lineTo((i+1)*STEP,col[i+1]+2);}ctx.stroke();
  ctx.strokeStyle='#3b2514';ctx.lineWidth=1.5;ctx.beginPath();for(let i=b.s;i<b.e;i++){ctx.moveTo(i*STEP+8,col[i]-1);ctx.lineTo(i*STEP+8,col[i]+9);}ctx.stroke();
  for(const x of[x0,x1]){ctx.fillStyle='#5b3b22';ctx.fillRect(x-8,b.y-96,16,108);ctx.fillStyle='#8a5f38';ctx.fillRect(x-8,b.y-96,5,108);}
}
function drawBridge(b){
  if(b.r){drawRope(b);return;}
  const x0=b.s*STEP,x1=b.e*STEP,y=b.y,TH=120;
  // أعمدة الجسر
  for(let x=x0+STEP*6;x<=x1-STEP*5;x+=STEP*8){
    const fy=ground[Math.round(x/STEP)]+30;
    const g=ctx.createLinearGradient(x-10,0,x+10,0);
    g.addColorStop(0,'#59606b');g.addColorStop(0.45,'#a3adba');g.addColorStop(1,'#444a54');
    ctx.fillStyle=g;ctx.fillRect(x-10,y+14,20,fy-y-14);
    ctx.fillStyle='rgba(0,0,0,0.25)';
    for(let yy=y+60;yy<fy;yy+=60)ctx.fillRect(x-10,yy,20,4);
  }
  // الهيكل المعدني العلوي (خلف السيارة)
  ctx.strokeStyle='#6d7783';ctx.lineWidth=4;
  const n=Math.floor((x1-x0)/48);
  ctx.beginPath();
  for(let k=0;k<=n;k++){
    const xx=x0+k*48;
    ctx.moveTo(xx,y);ctx.lineTo(xx,y-TH);
    if(k<n){
      if(k%2===0){ctx.moveTo(xx,y);ctx.lineTo(xx+48,y-TH);}else{ctx.moveTo(xx,y-TH);ctx.lineTo(xx+48,y);}
    }
  }
  ctx.stroke();
  let g=ctx.createLinearGradient(0,y-TH-8,0,y-TH+6);
  g.addColorStop(0,'#c3ccd7');g.addColorStop(1,'#59616c');
  ctx.fillStyle=g;ctx.fillRect(x0,y-TH-8,x1-x0,12);
  // البوابات
  ctx.strokeStyle='#8a95a3';ctx.lineWidth=7;
  ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x0+30,y-TH);ctx.moveTo(x1,y);ctx.lineTo(x1-30,y-TH);ctx.stroke();
  // سطح الجسر
  g=ctx.createLinearGradient(0,y,0,y+18);
  g.addColorStop(0,'#2a2c31');g.addColorStop(0.22,'#2a2c31');g.addColorStop(0.24,'#a9b3c0');g.addColorStop(1,'#4a515b');
  ctx.fillStyle=g;ctx.fillRect(x0,y,x1-x0,18);
  ctx.fillStyle='rgba(255,255,255,0.35)';
  for(let x=x0+10;x<x1;x+=40)ctx.fillRect(x,y+11,3,3);
  ctx.fillStyle='rgba(0,0,0,0.3)';ctx.fillRect(x0,y+18,x1-x0,3);
}

  ctx.strokeStyle='#2e2e33';ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(0,0,R-5.5,0,7);ctx.stroke();

  ctx.restore();
}
function altBody(k,cc){
  const g=ctx.createLinearGradient(0,-50,0,14);g.addColorStop(0,cc[0]);g.addColorStop(0.5,cc[1]);g.addColorStop(1,cc[2]);
  ctx.lineCap='round';ctx.lineJoin='round';
  if(k==='tractor'){
    ctx.fillStyle='#2b2b2b';ctx.fillRect(-62,0,132,11);
    ctx.fillStyle='#444';ctx.fillRect(64,-58,7,40);ctx.fillStyle='#222';ctx.fillRect(61,-62,13,6);

        btn(x+10,y+h-40,w-20,30,sel?'✔ مختارة':'اختيار',sel?'#ffd166':'#6bb5ff',sel?'#d9a021':'#2b6fd6',14,()=>{sv.map=i;MP=MAPS[i];});

  }else{
    const d=rowsFor(m),rows=d[1];

    const rh=clamp((sh*0.6)/rows.length-8,32,46),cols=['#7bea6b|#2fa63a','#6bb5ff|#2b6fd6','#ffb347|#e0761a','#ff7f9a|#d1305a'];
    rows.forEach((r,i)=>{const c=cols[i%4].split('|');btn(sw/2-150,sh*0.32+i*(rh+10),300,rh,r[0],c[0],c[1],17,r[1]);});

function drawUI0(){
  const m=st.mode;UR=[];
  if(m==='play'||m==='crash')return;

/* ================= الرسم الرئيسي ================= */
function render(dt){
  const vw=cw/scale,vh=ch/scale;
  const tx=car.x-vw*0.33+clamp(car.vx,-300,700)*0.2,ty=car.y-vh*0.52;
  camX+=(tx-camX)*Math.min(1,dt*5);camY+=(ty-camY)*Math.min(1,dt*3);
  const pal=MP.nt?palette(0.72):palette(clamp(((distM()/DAY_LEN)%1+1)%1,0,1));
  night=pal.night;
  drawSky(pal);
  setWorld();
  const i0=Math.max(1,Math.floor(camX/STEP)-2),i1=Math.min(ground.length-1,Math.ceil((camX+vw)/STEP)+2);
  drawTerrain(i0,i1,vw,vh);
  for(const b of bridges)if(b.e>=i0&&b.s<=i1)drawBridge(b);
  drawSigns(camX,camX+vw);
  for(const k of cans)if(!k.t&&k.x>camX-60&&k.x<camX+vw+60){
    drawCan(k);
    if(night>0.15){
      ctx.globalCompositeOperation='lighter';
      const g=ctx.createRadialGradient(k.x,surf(k.x)-40,2,k.x,surf(k.x)-40,60);
      g.addColorStop(0,'rgba(255,120,80,'+0.5*night+')');g.addColorStop(1,'rgba(255,120,80,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(k.x,surf(k.x)-40,60,0,7);ctx.fill();
      ctx.globalCompositeOperation='source-over';
    }
  }
  for(const k of coinsA)if(!k.t&&k.x>camX-40&&k.x<camX+vw+40){const y=surf(k.x)-48+Math.sin(time*4+k.x*0.05)*3,w=Math.abs(Math.cos(time*3+k.x*0.02))*9+3;ctx.fillStyle='#e0a410';ctx.beginPath();ctx.ellipse(k.x,y,w,11,0,0,7);ctx.fill();ctx.fillStyle='#ffd84a';ctx.beginPath();ctx.ellipse(k.x,y,w*0.7,8,0,0,7);ctx.fill();}
  drawCar();
  drawParts();
  if(night>0.05){setScreen();ctx.fillStyle='rgba(4,8,30,'+(MP.nt?0.12:0.38)*night+')';ctx.fillRect(0,0,cw,ch);}
  drawLights();
  drawHUD();
  drawUI();
}

/* ================= التحكم ================= */
const ptr=new Map();
function updInput(){
  let g=false,b=false;
  for(const s of ptr.values()){if(s==='g')g=true;else b=true;}
  input.pg=g;input.pb=b;
  input.gas=g||kb.gas;input.brake=b||kb.brake;
}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();initAudio();
  const u=hudScale();
  if(st.mode!=='play'&&st.mode!=='crash'){
    if(st.mode==='over'&&st.t<0.5)return;
    for(const r of UR)if(e.clientX>r.x&&e.clientX<r.x+r.w&&e.clientY>r.y&&e.clientY<r.y+r.h){r.f();save();break;}
    return;
  }
  if(e.clientX>cw-56*u&&e.clientY<52*u){go('pause');return;}
  if(Math.hypot(e.clientX-(cw-132*u),e.clientY-(ch-52*u))<36*u){if(sv.turbo>0&&tb<=0&&st.mode==='play'){sv.turbo--;tb=3.5;save();}return;}
  ptr.set(e.pointerId,e.clientX<cw/2?'b':'g');updInput();
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
});
function pend(e){ptr.delete(e.pointerId);updInput();}
cv.addEventListener('pointerup',pend);
cv.addEventListener('pointercancel',pend);
cv.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='ArrowRight'||k==='ArrowUp'||k==='d'||k==='D')kb.gas=true;
  else if(k==='ArrowLeft'||k==='ArrowDown'||k==='a'||k==='A')kb.brake=true;
  else if((k===' '||k==='Enter')&&(st.mode==='menu'||(st.mode==='over'&&st.t>0.5))){initAudio();startGame();}
  else if((k==='t'||k==='T')&&st.mode==='play'&&sv.turbo>0&&tb<=0){sv.turbo--;tb=3.5;}else if(k==='Escape'&&st.mode==='play')go('pause');
  updInput();
});
window.addEventListener('keyup',e=>{
  const k=e.key;
  if(k==='ArrowRight'||k==='ArrowUp'||k==='d'||k==='D')kb.gas=false;
  else if(k==='ArrowLeft'||k==='ArrowDown'||k==='a'||k==='A')kb.brake=false;
  updInput();
});

/* ================= الحلقة الرئيسية ================= */
initTerrain();ensureTerrain(START_X+2800);resetCar();
camX=car.x-(cw/scale)*0.33;camY=car.y-(ch/scale)*0.52;
let last=performance.now(),acc=0;
function frame(now){
  let dt=(now-last)/1000;last=now;
  if(!(dt>0))dt=0.016;if(dt>0.05)dt=0.05;
  acc+=dt;time+=dt;
  while(acc>=1/120){step(1/120);acc-=1/120;}
  updateFx(dt);updSound(dt);render(dt);
  requestAnimationFrame(frame);
}
window.__dbg={sv:sv,go:go,rowsFor:rowsFor,car:car,st:st,input:input,step:step,startGame:startGame,distM:distM,bridges:()=>bridges,surf:surf};
requestAnimationFrame(frame);
})();
